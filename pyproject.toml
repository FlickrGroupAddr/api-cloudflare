[project]
name = "fga-api-cloudflare-tools"
version = "0.0.0"
description = "Local development tooling for the FlickrGroupAddr hosted implementation."
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "Terry Ott" }]
dependencies = []

[dependency-groups]
dev = ["pyright==1.1.411", "ruff==0.16.3"]

[tool.uv]
required-version = "==0.12.5"
package = false

[tool.pyright]
include = ["scripts", "tests"]
pythonPlatform = "Windows"
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
line-ending = "lf"
