name: Finite existing-photo native network lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fga-existing-photo-native-network
  cancel-in-progress: false
jobs:
  characterize:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.0'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.5'
      - name: Install locked dependencies
        run: |
          npm install --global npm@12.2.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen
      - name: Verify finite artifact and fake lifecycle before cloud operations
        run: |
          node node_modules/typescript/bin/tsc --ignoreConfig --noEmit --strict --target ES2023 --module ESNext --moduleResolution Bundler --types @cloudflare/workers-types,node --skipLibCheck --allowImportingTsExtensions probes/existing-photo-native-network/worker.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/existing_photo_native_network.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen python -m unittest tests.test_existing_photo_native_network_lifecycle
      - name: Prepare exactly two new Workers and one new D1
        id: prepare
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FGA_CLOUDFLARE_CI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.FGA_CLOUDFLARE_ACCOUNT_ID }}
          FGA_NATIVE_NETWORK_ACCESS_TOKEN: ${{ secrets.FGA_NATIVE_NETWORK_ACCESS_TOKEN }}
          FGA_NATIVE_NETWORK_CANARY_TOKEN: ${{ secrets.FGA_NATIVE_NETWORK_CANARY_TOKEN }}
        run: uv run --frozen python -m scripts.existing_photo_native_network_lifecycle prepare
      - name: Publish nonsecret operator ready metadata while endpoints remain available
        id: ready
        if: steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: existing-photo-native-network-ready
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: .coordination-runs/existing-photo-native-network/ready.json
      - name: Observe final report or expiry and clean exact created resources
        if: always()
        timeout-minutes: 25
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FGA_CLOUDFLARE_CI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.FGA_CLOUDFLARE_ACCOUNT_ID }}
          FGA_NATIVE_NETWORK_READY_PUBLISHED: ${{ steps.ready.outcome }}
        run: uv run --frozen python -m scripts.existing_photo_native_network_lifecycle hold-cleanup
      - name: Retain only sanitized cleanup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: existing-photo-native-network-cleanup
          if-no-files-found: ignore
          include-hidden-files: true
          path: .coordination-runs/existing-photo-native-network/cleanup.json
