name: Native matrix diagnostic (not release qualification)
on:
  workflow_dispatch:
    inputs:
      case:
        description: Partial diagnostic case
        type: choice
        options:
          - FP-MEM-001
          - FP-PRE-004
        default: FP-MEM-001
permissions:
  contents: read
concurrency:
  group: fga-release-validation
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.5'
      - name: Install locked dependencies
        run: |
          npm install --global npm@12.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --frozen
      - name: Run a partial diagnostic only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FGA_CLOUDFLARE_CI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.FGA_CLOUDFLARE_ACCOUNT_ID }}
          FGA_DIAGNOSTIC_CASE: ${{ inputs.case }}
        run: uv run --frozen python -m scripts.production_matrix --environment hosted-db --native --provenance --section core --stop-after $env:FGA_DIAGNOSTIC_CASE
      - name: Retain sanitized partial diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-matrix-diagnostic
          include-hidden-files: true
          if-no-files-found: ignore
          path: .coordination-runs/**/matrix-report.json
